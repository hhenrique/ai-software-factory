# A real, deployable Workflow Definition — not a reference/test fixture
# (those live in internal/workflowdef/fixtures and are embedded for
# docs/tests, see internal/workflowdef/fixtures.go). Same DAG, same
# budgets, same schemas as that fixture's issue-to-pr-standard — which
# harness/model backs each role isn't declared here at all (see roles:
# below and 03-roles-and-harness-contract.md): it's whichever Worker the
# control plane's role_assignments currently has playing that role for
# *this* workflow name, edited from the Workflows view, not this file.
# Was named issue-to-pr-claude-only while Claude Code was the only
# licensed harness available to run any role for real; renamed once that
# stopped being true (role_assignments now also runs codex/copilot for
# real) — the name never described the DAG, only a since-lifted
# constraint on which Worker could play a role.
workflow: issue-to-pr
version: 1

roles: [planner, coder, reviewer]

budgets:
  verify_rounds: { max_attempts: 3 }
  review_rounds: { max_rounds: 4, max_tokens: 60000 }

steps:
  - id: provision
    type: tool
    action: worktree.create
    next: plan

  - id: plan
    type: agent
    role: planner
    context: [task_description, worktree_path]
    output_schema: {
      verdict: [proceed, reject, escalate],
      assessment: string,
      scope_contract: { acceptance_criteria: [string], in_scope_paths: [string], non_goals: [string] },
    }
    approve_resume: execute   # where an approved plan resumes (docs/01's mandatory plan-approval gate)
    on:
      proceed:  REVIEW_PENDING
      reject:   FAILED
      escalate: REVIEW_PENDING
    on_malformed_output: REVIEW_PENDING

  - id: execute
    type: agent
    role: coder
    context: [scope_contract, worktree_path, task_description]
    output_schema: { change_summary: string }
    next: verify
    on_malformed_output: REVIEW_PENDING

  - id: verify
    type: tool
    action: run.tests_lint_build
    budget: verify_rounds
    on:
      pass: review
      fail: revise_verify
      budget_exhausted: FAILED

  - id: revise_verify
    type: agent
    role: coder
    context: [scope_contract, worktree_path, task_description, failing_tests_diff]
    output_schema: { change_summary: string }
    next: verify
    on_malformed_output: REVIEW_PENDING

  - id: review
    type: agent
    role: reviewer
    context: [scope_contract, diff]
    budget: review_rounds
    output_schema: {
      findings: [{ description: string, location: string, scope_classification: [in_scope, out_of_scope], severity: [blocking, advisory] }],
      verdict: [approved, changes_required],
      assessment: string,
    }
    on:
      approved:         create_pr
      changes_required: coder_response
      budget_exhausted: REVIEW_PENDING
    on_malformed_output: REVIEW_PENDING

  - id: coder_response
    type: agent
    role: coder
    context: [scope_contract, findings, conversation_open_items]
    output_schema: { verdict: [address, dispute, escalate, out_of_scope], rationale: string }
    on:
      address:      revise_review
      dispute:      review
      escalate:     REVIEW_PENDING
      out_of_scope: { action: task.create(source=review-finding), next: review }
    on_malformed_output: REVIEW_PENDING

  - id: revise_review
    type: agent
    role: coder
    context: [scope_contract, worktree_path]
    output_schema: { change_summary: string }
    next: verify
    on_malformed_output: REVIEW_PENDING

  - id: create_pr
    type: tool
    action: pr.create_and_link
    next: COMPLETED
