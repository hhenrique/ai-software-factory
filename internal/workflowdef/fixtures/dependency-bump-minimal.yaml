workflow: dependency-bump-minimal
version: 1

roles: [coder]

budgets:
  verify_rounds: { max_attempts: 2 }

steps:
  - id: provision
    type: tool
    action: worktree.create
    next: execute

  - id: execute
    type: agent
    role: coder
    context: [worktree_path, task_description]
    next: verify

  - id: verify
    type: tool
    action: run.tests_lint_build
    budget: verify_rounds
    on:
      pass: create_pr
      fail: revise_verify
      budget_exhausted: FAILED

  - id: revise_verify
    type: agent
    role: coder
    context: [worktree_path, task_description, failing_tests_diff]
    next: verify

  - id: create_pr
    type: tool
    action: pr.create_and_link
    next: COMPLETED
