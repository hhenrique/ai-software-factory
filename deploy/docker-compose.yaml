services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    # Single shared Postgres instance per docs/05: Temporal's own
    # execution-history + visibility databases are separate databases
    # within this instance (auto-setup creates them below), not a second
    # Postgres container. The control plane's projection store is a third
    # database in this same instance (postgres-init/01-projection-store.sql),
    # not a second Postgres container.
    volumes:
      - factory-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # eventlog (internal/eventlog) connects directly from the worker
    # process on the host, not from another container — needs a host port,
    # unlike temporal's own DB access which stays container-to-container.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:8080"
    ports:
      - "8080:8080"

volumes:
  factory-postgres-data:
